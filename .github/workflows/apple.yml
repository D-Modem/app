# The modem for Apple's systems, and the Kotlin the apps share on iOS: the engine with D-Modem-RE, libre and
# Mbed TLS built for iOS (devices and simulator) and macOS as an
# XCFramework (ios/build-native.sh), and its Swift tests run on macOS
# (ios/DModemSmoke): the modem through its C API, as the iOS app has it;
# DModemKit's tests, and the iOS app (ios/DModem) built for the simulator.
#
# D-Modem-RE is a private submodule: the DMODEM_TOKEN secret (as
# android.yml's).
name: Apple

# (a branch's commits run once, as its pull request: pushed, only main's)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a newer commit on a pull request cancels the run before it (main's all run)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine:
    runs-on: macos-15
    # (a hung test ends here, not at GitHub's 6 hours)
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.DMODEM_TOKEN || github.token }}

      - name: Ninja
        run: brew install ninja

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # the Kotlin the apps share (shared/): its common tests on an iOS
      # simulator, its framework built
      - name: Shared Kotlin on iOS
        run: ./gradlew :shared:iosSimulatorArm64Test :shared:linkDebugFrameworkIosArm64

      - name: Build the XCFramework
        run: ios/build-native.sh

      - name: Swift tests (macOS)
        run: swift test --package-path ios/DModemSmoke

      - name: DModemKit's tests (macOS)
        run: swift test --package-path ios/DModemKit

      # the iOS app: its project from ios/DModem/project.yml, built for the simulator
      - name: The shared Kotlin as an XCFramework
        run: ./gradlew :shared:assembleDModemSharedReleaseXCFramework

      # arm64 only: the shared Kotlin's XCFramework has no x86_64 simulator slice
      - name: The iOS app (simulator)
        run: |
          brew install xcodegen
          cd ios/DModem && xcodegen generate
          xcodebuild -project DModem.xcodeproj -scheme DModem \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build

      - uses: actions/upload-artifact@v4
        with:
          name: DModemEngine.xcframework
          path: build-apple/DModemEngine.xcframework

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: build-apple/**/_deps/*.log
