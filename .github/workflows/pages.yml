# The app's site, https://d-modem.github.io/app/: docs/ and the README with
# brand's shared theme and workflow (brand's docs/sites.md).  A pull request
# builds it, main deploys it.  It fails if docs/settings.md isn't what the
# apps' ModemSettings make now (tools/settings_ref.py).
name: Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  site:
    uses: D-Modem/brand/.github/workflows/site.yml@main
    with:
      prepare: python3 tools/settings_ref.py --check
